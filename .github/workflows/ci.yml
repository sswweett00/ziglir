name: CI & Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Run Unit Tests (Debug)
        run: zig build test

      - name: Run Unit Tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: Build LIR Compiler (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Test LIR Compiler
        run: |
          ./zig-out/bin/lir version
          ./zig-out/bin/lir build tests/fixtures/test.lir -o hello_test
          ./hello_test
          ./zig-out/bin/lir build tests/fixtures/test_str.lir -o str_test
          ./str_test
          ./zig-out/bin/lir build tests/fixtures/test_arr.lir -o array_test
          ./array_test
          ./zig-out/bin/lir build tests/fixtures/test_complex.lir -o complex_test
          ./complex_test
          ./zig-out/bin/lir build tests/fixtures/test_concat.lir -o concat_test
          ./concat_test
          ./zig-out/bin/lir build examples/features-demo.lir -o features_test
          ./features_test
          # Regression: stack allocation must cover >64 virtual registers.
          ./zig-out/bin/lir build examples/stack-pressure.lir -o stack_pressure_test
          test "$(./stack_pressure_test)" = "47"
          # Invalid source must fail compilation rather than produce a partial executable.
          printf '%s\n' 'fn main() { let x = "unterminated }' > invalid_string.lir
          if ./zig-out/bin/lir build invalid_string.lir -o invalid_string_out; then
            echo "ERROR: unterminated string unexpectedly compiled"
            exit 1
          fi
          printf '%s\n' 'fn main() { let x = 9223372036854775808 }' > invalid_integer.lir
          if ./zig-out/bin/lir build invalid_integer.lir -o invalid_integer_out; then
            echo "ERROR: out-of-range integer unexpectedly compiled"
            exit 1
          fi
          printf '%s\n' 'fn main() { let x = $ }' > invalid_character.lir
          if ./zig-out/bin/lir build invalid_character.lir -o invalid_character_out; then
            echo "ERROR: unknown character unexpectedly compiled"
            exit 1
          fi

      - name: Smoke-test performance benchmark harness
        run: python3 bench/bench.py ./zig-out/bin/lir tests/fixtures/test.lir --repeats 3

      - name: Upload LIR Binary
        uses: actions/upload-artifact@v4
        with:
          name: lir-linux-x86_64
          path: zig-out/bin/lir
